pricing_version: 4

# Note: OpenRouter (provider="openrouter") models do not need entries here.
# OpenRouter reports the real cost per call, which the gateway records into
# cost.provider_reported_usd. The openrouter/<vendor>/<model> entries below are a
# YAML fallback for streamed responses (where LiteLLM may drop the reported cost).
# OpenRouter slugs use dots (anthropic/claude-haiku-5.5), not dashes.
models:
  openai/gpt-4.1-mini:
    input_rate_per_1k_tokens: 0.0004
    output_rate_per_1k_tokens: 0.0016
    cache_write_rate_per_1k_tokens: 0.0004
    cache_read_rate_per_1k_tokens: 0.0001
    last_updated: "2026-05-27"
    source_url: "https://openai.com/api/pricing"

  anthropic/claude-sonnet-4-5:
    input_rate_per_1k_tokens: 0.003
    output_rate_per_1k_tokens: 0.015
    cache_write_rate_per_1k_tokens: 0.00375
    cache_read_rate_per_1k_tokens: 0.0003
    last_updated: "2026-05-27"
    source_url: "https://platform.claude.com/docs/en/about-claude/pricing"

  anthropic/claude-haiku-4-5:
    input_rate_per_1k_tokens: 0.001
    output_rate_per_1k_tokens: 0.005
    cache_write_rate_per_1k_tokens: 0.00125
    # Anthropic pricing page checked 2026-10-24: 1h writes cost $2/MTok.
    cache_write_1h_rate_per_1k_tokens: 0.002
    cache_read_rate_per_1k_tokens: 0.0001
    last_updated: "2026-10-24"
    source_url: "https://platform.claude.com/docs/en/about-claude/pricing"

  anthropic/claude-haiku-5-5:
    input_rate_per_1k_tokens: 0.0001
    output_rate_per_1k_tokens: 0.0005
    cache_write_rate_per_1k_tokens: 0.000125
    cache_write_1h_rate_per_1k_tokens: 0.0002
    cache_read_rate_per_1k_tokens: 0.00001
    # Strictly above 100k inclusive input tokens, all tokens use these rates.
    # Input includes cache reads and writes, even when part of the prompt is a hit.
    long_prompt_tier:
      threshold_tokens: 100000
      input_rate_per_1k_tokens: 0.0005
      output_rate_per_1k_tokens: 0.0025
      cache_write_rate_per_1k_tokens: 0.000625
      cache_write_1h_rate_per_1k_tokens: 0.001
      cache_read_rate_per_1k_tokens: 0.00005
